<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiedza codziennie</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.6;background:#f6f7f9;color:#222}
  h1{font-size:1.5rem;margin-bottom:.3rem}
  h1 a{color:inherit;text-decoration:none}
  .sub{color:#666;margin-top:0}
  form{display:flex;gap:.5rem;margin:1rem 0}
  input{flex:1;padding:.6rem;font-size:1rem;border:1px solid #ccc;border-radius:8px}
  button{padding:.6rem 1rem;font-size:1rem;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
  button:disabled{background:#a9bde8;cursor:default}
  button.ghost{background:transparent;color:#2563eb;padding:.4rem 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}
  .tile{background:#fff;color:#222;text-align:left;padding:1rem;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);font-size:1rem}
  .tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .tile small{display:block;color:#666;margin-top:.2rem}
  .list{display:flex;flex-direction:column;gap:.6rem}
  .card{background:#fff;padding:1.2rem;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .card h2{margin-top:0;font-size:1.2rem}
  .txt{white-space:pre-line}
  .bar{height:6px;background:#dde3ee;border-radius:3px;margin-bottom:1rem;overflow:hidden}
  .bar div{height:100%;background:#2563eb}
  .meta{color:#666;font-size:.9rem;margin:.3rem 0}
  .note{color:#666;font-size:.85rem}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.5rem}
  .opt:disabled{background:#fff;color:#222;cursor:default}
  .opt.ok{background:#d1fae5}
  .opt.bad{background:#fee2e2}
  small a{color:#555}
</style>
</head>
<body>
<h1><a href="#" id="home">Wiedza codziennie</a></h1>
<p class="sub" id="stats"></p>
<div id="out"></div>

<script>
// Katalog: [nazwa dla użytkownika, tytuł artykułu w Wikipedii]
const CATALOG = [
  { name: '💻 Informatyka', topics: [
    ['Jak działa programowanie', 'Programowanie komputerów'],
    ['Czym jest algorytm', 'Algorytm'],
    ['Jak działa internet', 'Internet'],
    ['Czym jest sztuczna inteligencja', 'Sztuczna inteligencja'],
    ['Jak działa procesor', 'Procesor'],
  ]},
  { name: '🔬 Nauka i kosmos', topics: [
    ['Czemu śnimy', 'Sen'],
    ['Czarne dziury', 'Czarna dziura'],
    ['Jak działa DNA', 'Kwas deoksyrybonukleinowy'],
    ['Ewolucja', 'Ewolucja'],
    ['Układ Słoneczny', 'Układ Słoneczny'],
  ]},
  { name: '🧠 Psychologia', topics: [
    ['Jak działa pamięć', 'Pamięć'],
    ['Czym są emocje', 'Emocja'],
    ['Motywacja', 'Motywacja'],
    ['Stres', 'Stres'],
    ['Nawyki', 'Nawyk'],
  ]},
  { name: '❤️ Ciało i zdrowie', topics: [
    ['Mózg człowieka', 'Mózgowie człowieka'],
    ['Układ odpornościowy', 'Układ odpornościowy'],
    ['Witaminy', 'Witaminy'],
    ['Mięśnie', 'Mięsień'],
    ['Serce', 'Serce'],
  ]},
  { name: '🏛️ Historia', topics: [
    ['II wojna światowa', 'II wojna światowa'],
    ['Cesarstwo rzymskie', 'Cesarstwo rzymskie'],
    ['Średniowiecze', 'Średniowiecze'],
    ['Rewolucja przemysłowa', 'Rewolucja przemysłowa'],
    ['Zimna wojna', 'Zimna wojna'],
  ]},
  { name: '💰 Ekonomia', topics: [
    ['Inflacja', 'Inflacja'],
    ['Jak działa giełda', 'Giełda papierów wartościowych'],
    ['Bitcoin', 'Bitcoin'],
    ['Podatki', 'Podatek'],
    ['Czym jest pieniądz', 'Pieniądz'],
  ]},
];

const out = document.getElementById('out');
const statsEl = document.getElementById('stats');

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function api(params) {
  const r = await fetch('/api?' + new URLSearchParams(params));
  return r.json();
}

/* ---------- postępy (zapis w przeglądarce) ---------- */

const LS_KEY = 'wc_progress_v1';
const today = () => new Date().toLocaleDateString('sv-SE');
const yesterday = () => new Date(Date.now() - 864e5).toLocaleDateString('sv-SE');
const daysWord = n => n === 1 ? 'dzień' : 'dni';

function loadP() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_KEY));
    if (p && p.done && p.streak) return p;
  } catch (e) {}
  return { done: {}, streak: { last: '', count: 0 } };
}
function saveP(p) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch (e) {}
}
function markDone(title, n, score, total) {
  const p = loadP();
  p.done[title + '#' + n] = { score, total, at: today() };
  if (p.streak.last !== today()) {
    p.streak.count = p.streak.last === yesterday() ? p.streak.count + 1 : 1;
    p.streak.last = today();
  }
  saveP(p);
}
function streakInfo() {
  const s = loadP().streak;
  const active = s.last === today() || s.last === yesterday();
  return active ? s.count : 0;
}
function renderStats() {
  const done = Object.keys(loadP().done).length;
  const s = streakInfo();
  statsEl.textContent = (s ? '🔥 Seria: ' + s + ' ' + daysWord(s) + ' · ' : '') +
    'Ukończone lekcje: ' + done;
}

/* ---------- ekrany ---------- */

function showHome() {
  renderStats();
  out.replaceChildren();
  const form = el('form');
  const input = el('input'); input.placeholder = 'Szukaj własnego tematu...';
  form.append(input, el('button', 'Szukaj'));
  form.onsubmit = e => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) loadArticle(q, q, null);
  };
  const grid = el('div', undefined, 'grid');
  CATALOG.forEach(cat => {
    const t = el('button', cat.name, 'tile');
    t.onclick = () => showCategory(cat);
    grid.append(t);
  });
  out.append(form, grid);
}

function showCategory(cat) {
  out.replaceChildren();
  const back = el('button', '← Wszystkie kategorie', 'ghost');
  back.onclick = showHome;
  const list = el('div', undefined, 'list');
  cat.topics.forEach(([label, wiki]) => {
    const t = el('button', label, 'tile');
    t.onclick = () => loadArticle(wiki, label, cat);
    list.append(t);
  });
  out.append(back, el('h2', cat.name), list);
}

async function loadArticle(wiki, label, cat) {
  out.textContent = 'Ładuję...';
  try {
    const d = await api({ action: 'lessons', title: wiki });
    if (d.error) throw new Error(d.error);
    showLessons({ label, cat, title: d.title, lessons: d.lessons });
  } catch (e) {
    out.replaceChildren();
    const b = el('button', '← Wróć', 'ghost');
    b.onclick = () => cat ? showCategory(cat) : showHome();
    out.append(el('p', 'Nie znaleziono artykułu lub wystąpił błąd.'), b);
  }
}

function showLessons(art) {
  renderStats();
  out.replaceChildren();
  const back = el('button', art.cat ? '← ' + art.cat.name : '← Wszystkie kategorie', 'ghost');
  back.onclick = () => art.cat ? showCategory(art.cat) : showHome();
  const done = loadP().done;
  const list = el('div', undefined, 'list');
  art.lessons.forEach((l, i) => {
    const names = l.names.slice(0, 3).join(', ') + (l.names.length > 3 ? '…' : '');
    const d = done[art.title + '#' + i];
    const t = el('button', (d ? '✓ ' : '') + 'Lekcja ' + (i + 1) + ': ' + names, 'tile');
    if (d && d.total) t.append(el('small', 'Quiz: ' + d.score + ' / ' + d.total));
    t.onclick = () => openLesson(art, i);
    list.append(t);
  });
  out.append(back, el('h2', art.label),
    el('p', 'Lekcji: ' + art.lessons.length + ' (maks. 10 slajdów każda)', 'meta'),
    list, sourceLine(art));
}

async function openLesson(art, li) {
  out.replaceChildren();
  out.append(el('p', 'Przygotowuję lekcję... Za pierwszym razem może to potrwać kilkanaście sekund. Potem lekcja jest zapisana i otwiera się od razu.'));
  try {
    const data = await api({ action: 'lesson', title: art.title, n: li });
    if (data.error) throw new Error(data.error);
    window.scrollTo(0, 0);
    showSlide(art, li, data, 0);
  } catch (e) {
    out.replaceChildren();
    const b = el('button', '← Lista lekcji', 'ghost');
    b.onclick = () => showLessons(art);
    out.append(el('p', 'Nie udało się pobrać lekcji. Spróbuj ponownie za chwilę.'), b);
  }
}

function showSlide(art, li, data, si) {
  out.replaceChildren();
  const total = data.slides.length;
  const back = el('button', '← Lista lekcji', 'ghost');
  back.onclick = () => showLessons(art);

  const bar = el('div', undefined, 'bar');
  const fill = el('div'); fill.style.width = ((si + 1) / total * 100) + '%';
  bar.append(fill);

  const card = el('div', undefined, 'card');
  card.append(el('h2', data.slides[si].h), el('div', data.slides[si].t, 'txt'));

  const nav = el('div', undefined, 'nav');
  const prev = el('button', 'Wstecz'); prev.disabled = si === 0;
  prev.onclick = () => { showSlide(art, li, data, si - 1); window.scrollTo(0, 0); };
  let nextLabel = 'Dalej', nextAction = () => showSlide(art, li, data, si + 1);
  if (si === total - 1) {
    if (data.quiz && data.quiz.length) {
      nextLabel = 'Quiz →';
      nextAction = () => showQuiz(art, li, data, 0, 0);
    } else {
      nextLabel = 'Zakończ ✓';
      nextAction = () => finishLesson(art, li, 0, 0);
    }
  }
  const next = el('button', nextLabel);
  next.onclick = () => { nextAction(); window.scrollTo(0, 0); };
  nav.append(prev, el('span', (si + 1) + ' / ' + total), next);

  const note = el('p', data.source === 'wikipedia'
    ? 'Wersja podstawowa: surowy tekst z Wikipedii (lekcja AI chwilowo niedostępna).'
    : 'Lekcja przygotowana przez AI na podstawie Wikipedii. W razie wątpliwości sprawdź oryginał.', 'note');

  out.append(back, el('p', art.label + ' · Lekcja ' + (li + 1) + ' z ' + art.lessons.length, 'meta'),
    bar, card, nav, note, sourceLine(art));
}

function showQuiz(art, li, data, qi, score) {
  out.replaceChildren();
  const q = data.quiz[qi];
  const last = qi === data.quiz.length - 1;
  const card = el('div', undefined, 'card');
  card.append(el('p', 'Quiz · pytanie ' + (qi + 1) + ' z ' + data.quiz.length, 'meta'), el('h2', q.q));

  const opts = el('div', undefined, 'list');
  const info = el('p', undefined, 'txt');
  const next = el('button', last ? 'Zobacz wynik' : 'Dalej');
  next.style.display = 'none';

  const btns = q.options.map((o, idx) => {
    const b = el('button', o, 'tile opt');
    b.onclick = () => {
      const good = idx === q.answer;
      btns.forEach((x, j) => { x.disabled = true; if (j === q.answer) x.classList.add('ok'); });
      if (!good) b.classList.add('bad');
      info.textContent = (good ? 'Dobrze! ' : 'Nie tym razem. ') + (q.why || '');
      const sc = score + (good ? 1 : 0);
      next.style.display = '';
      next.onclick = () => {
        if (last) finishLesson(art, li, sc, data.quiz.length);
        else showQuiz(art, li, data, qi + 1, sc);
        window.scrollTo(0, 0);
      };
    };
    opts.append(b);
    return b;
  });

  card.append(opts, info);
  const nav = el('div', undefined, 'nav'); nav.append(next);
  out.append(card, nav);
}

function finishLesson(art, li, score, total) {
  markDone(art.title, li, score, total);
  renderStats();
  out.replaceChildren();
  const card = el('div', undefined, 'card');
  card.append(el('h2', 'Lekcja ukończona 🎉'));
  if (total) card.append(el('p', 'Wynik quizu: ' + score + ' / ' + total));
  const s = streakInfo();
  card.append(el('p', '🔥 Seria: ' + s + ' ' + daysWord(s) + ' z rzędu'));

  const nav = el('div', undefined, 'nav');
  const list = el('button', 'Lista lekcji');
  list.onclick = () => showLessons(art);
  nav.append(list);
  if (li < art.lessons.length - 1) {
    const n = el('button', 'Następna lekcja →');
    n.onclick = () => openLesson(art, li + 1);
    nav.append(n);
  }
  out.append(card, nav);
}

function sourceLine(art) {
  const p = el('p'); const sm = el('small', 'Źródło: ');
  const a = el('a', 'Wikipedia: ' + art.title);
  a.href = 'https://pl.wikipedia.org/wiki/' + encodeURIComponent(art.title);
  a.target = '_blank'; a.rel = 'noopener';
  sm.append(a, ' (CC BY-SA)'); p.append(sm);
  return p;
}

document.getElementById('home').onclick = e => { e.preventDefault(); showHome(); };
showHome();
</script>
</body>
</html>
